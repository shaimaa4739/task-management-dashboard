  <header class="header">
    <div class="header__bar">
      <a routerLink="/" class="brand">
        <span class="brand__logo" aria-hidden="true">
          <svg viewBox="0 0 12 12" class="brand__check" fill="none" stroke="white" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
            <path d="M2.5 6.2 4.9 8.5 9.5 3.6" />
          </svg>
        </span>
        <span>Task Manager</span>
      </a>

      <div class="search">
        <div class="search__field">
          <span aria-hidden="true" class="search__icon">🔍</span>
          <input
            type="search"
            aria-label="Search tasks"
            placeholder="Search tasks..."
            class="search__input"
          />
        </div>
      </div>

      <div class="header__actions">
        <button type="button" aria-label="Notifications" class="header__bell">
          <span aria-hidden="true">🔔</span>
        </button>
        <span class="avatar header__avatar">JD</span>
      </div>
    </div>
  </header>
