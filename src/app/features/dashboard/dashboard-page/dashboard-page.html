<h1 class="sr-only">Dashboard</h1>

<div class="dashboard">
  @if (isLoading()) {
    <p class="dashboard-state dashboard-state--loading" role="status">Loading tasks...</p>
  } @else if (error()) {
    <div class="dashboard-state dashboard-state--error" role="alert">
      <p>Tasks could not be loaded.</p>
      <button class="dashboard-state__retry" type="button" (click)="onRetry()">
        Retry
      </button>
    </div>
  } @else if (tasks().length === 0) {
    <p class="dashboard-state dashboard-state--empty" role="status">No tasks yet.</p>
  } @else {
    <app-stats-summary [stats]="stats()" />

    <app-task-filter-bar
      [filters]="filters"
      [activeFilter]="filter()"
      [sortBy]="sortBy()"
      (filterChange)="onFilterChange($event)"
      (sortChange)="onSortChange($event)"
      (newTask)="onNewTask()"
    />

    @if (hasNoMatchingTasks()) {
      <p class="dashboard-state dashboard-state--empty" role="status">
        No tasks match your search and filters.
      </p>
    } @else {
      <app-task-board [columns]="columns()" />
    }
  }
</div>
