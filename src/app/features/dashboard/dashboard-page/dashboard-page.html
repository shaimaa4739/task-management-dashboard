<h1 class="sr-only">Dashboard</h1>

<div class="dashboard">
  <app-stats-summary [stats]="stats" />

  <app-task-filter-bar
    [filters]="filters"
    [activeFilter]="filter()"
    [sortBy]="sortBy()"
    (filterChange)="onFilterChange($event)"
    (sortChange)="onSortChange($event)"
    (newTask)="onNewTask()"
  />

  <app-task-board [columns]="columns()" />
</div>
